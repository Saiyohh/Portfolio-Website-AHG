<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alexander H Garcia — Game &amp; Level Designer and co-founder of Studio 300. Demo reel, projects and resume.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <title>Alexander H Garcia — Game &amp; Level Designer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/footer.css">

  <!-- Scripts -->
  <script src="js/components.js" defer></script>
  <script src="js/navbar.js" defer></script>
</head>
<body>
  <div class="site-wrapper world page-home">

    <!-- ========== NAVBAR ========== -->
    <nav id="navbar-placeholder"></nav>

    <!-- ========== MAIN ========== -->
    <main>
      <section class="stage">
        <div class="stage__inner">
          <div class="stage__box">
          <div class="reel">
            <video src="./assets/images/pf-demo-reel-web.mp4" poster="./assets/images/pf-demo-reel-poster.jpg" autoplay loop muted playsinline aria-label="Demo reel: gameplay from my game and level design projects"></video>
          </div>

          <div class="band">
            <div>
              <h1 class="band__name">Alexander H Garcia</h1>
              <p class="band__role"><span>Game &amp; Level Designer</span> <i aria-hidden="true">·</i> <span>Co-founder, Studio 300</span></p>
            </div>
            <div class="band__actions">
              <a href="./projects/" class="block block--tri is-filled">Projects</a>
              <a href="./resume.html" class="block block--sq">Resume</a>
            </div>
          </div>
        </div>
          </div>
      </section>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer id="footer-placeholder"></footer>

  </div>

  <script>
    // Reduced motion: hold the reel on its poster and hand over the controls.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var reel = document.querySelector('.reel video');
      reel.removeAttribute('autoplay');
      reel.pause();
      reel.controls = true;
    }

    // The nav's mark and switch line up with the edges of the name band.
    (function () {
      var band = document.querySelector('.band');
      var wrap = document.querySelector('.site-wrapper');
      if (!band || !wrap || !window.ResizeObserver) return;
      new ResizeObserver(function () {
        wrap.style.setProperty('--nav-w', band.offsetWidth + 'px');
      }).observe(band);
    })();
  </script>
</body>
</html>
